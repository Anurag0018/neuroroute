<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NeuroRoute — Live Execution Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0f1220; color:#e8eaf2; margin:0; padding:24px; }
  h1 { font-size:22px; } .sub { color:#9aa3c0; margin-bottom:20px; }
  textarea { width:100%; height:70px; background:#171b30; color:#fff; border:1px solid #2c3355; border-radius:8px; padding:10px; }
  button { background:#5b6cff; color:#fff; border:0; padding:10px 22px; border-radius:8px; cursor:pointer; margin-top:10px; }
  .card { background:#171b30; border:1px solid #2c3355; border-radius:10px; padding:16px; margin-top:16px; }
  .chip { display:inline-block; background:#232949; border-radius:20px; padding:5px 12px; margin:3px; font-size:13px; }
  .chip b { color:#8fd0ff; } .bar { height:10px; background:#232949; border-radius:5px; overflow:hidden; }
  .bar > div { height:100%; background:#43d17c; } table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { text-align:left; padding:5px 8px; border-bottom:1px solid #232949; } .muted { color:#9aa3c0; }
.tracerow { cursor: pointer; }
.tracerow:hover td { color: #fff; }
</style>
</head>
<body>
<h1>🧠 NeuroRoute — Live Execution Dashboard</h1>
<div class="sub">Watch routing, the execution graph, confidence and cost per request. Upload a document (PDF/TXT/MD) and it becomes retrievable — queries then attach it automatically.</div>
<textarea id="q">Research how retrieval augmented generation improves factual accuracy</textarea>
<br><button onclick="run()">Run request</button>
<span style="margin-left:14px">
  <input type="file" id="doc" accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.webp,.gif">
  <button onclick="upload()">Upload document</button>
  <span id="docStatus" class="muted"></span>
</span>
<div id="out"></div>
<div id="traces"></div>
<script>
function spanOffsets(t) {
  // Level-synchronous executor: a node starts when its slowest
  // dependency finishes; siblings overlap. The decision/planning
  // call (when an LLM planned the run) precedes all execution.
  const base = (t.decision && t.decision.latency_ms) || 0;
  const byId = {}; t.execution_graph.forEach(n => byId[n.node_id] = n);
  const off = {};
  function start(n) {
    if (off[n.node_id] !== undefined) return off[n.node_id];
    const deps = (n.depends_on || []).filter(d => byId[d]);
    off[n.node_id] = deps.length
      ? Math.max(...deps.map(d => start(byId[d]) + byId[d].latency_ms)) : 0;
    return off[n.node_id];
  }
  t.execution_graph.forEach(start);
  const graphTotal = t.execution_graph.reduce(
    (m, n) => Math.max(m, off[n.node_id] + n.latency_ms), 0);
  return {base, off, total: base + graphTotal};
}

function renderWaterfall(t) {
  const {base, off, total} = spanOffsets(t);
  if (!total) return '';
  const W = 720, labelW = 150, plotW = W - labelW - 70, rowH = 26, top = 18;
  const rows = [];
  if (base > 0) rows.push({id: 'decision (' + (t.decision.source || '') + ')', kind: 'planning', start: 0, dur: base});
  t.execution_graph.forEach(n => rows.push({id: n.node_id, kind: n.kind, start: base + off[n.node_id], dur: n.latency_ms}));
  const colors = {retrieve: '#2dd4bf', generate: '#5b6cff', verify: '#43d17c', planning: '#e0a458', tool: '#e879c6', perceive: '#c084fc'};
  const x = ms => labelW + (ms / total) * plotW;
  let bars = '', ticks = '';
  [0, 0.25, 0.5, 0.75, 1].forEach(f => {
    const tx = x(total * f);
    ticks += `<line x1="${tx}" y1="${top - 4}" x2="${tx}" y2="${top + rows.length * rowH}" stroke="#2c3355"/>` +
             `<text x="${tx}" y="10" fill="#9aa3c0" font-size="10" text-anchor="middle">${Math.round(total * f)}ms</text>`;
  });
  rows.forEach((r, i) => {
    const y = top + i * rowH + 4, w = Math.max(2, (r.dur / total) * plotW);
    bars += `<text x="${labelW - 8}" y="${y + 13}" fill="#e8eaf2" font-size="11.5" text-anchor="end">${r.id}</text>` +
      `<rect x="${x(r.start)}" y="${y}" width="${w}" height="16" rx="4" fill="${colors[r.kind] || '#888'}"/>` +
      `<text x="${x(r.start) + w + 6}" y="${y + 13}" fill="#9aa3c0" font-size="11">${r.dur}ms</text>`;
  });
  const height = top + rows.length * rowH + 6;
  return `<div class="card"><b>Execution timeline</b><p class="muted">Span waterfall — parallel branches overlap in time; offsets derived from graph dependencies (level-synchronous executor).</p><div style="overflow-x:auto"><svg width="${W}" height="${height}" viewBox="0 0 ${W} ${height}">${ticks}${bars}</svg></div></div>`;
}

function levelMap(nodes) {
  const byId = {}; nodes.forEach(n => byId[n.node_id] = n);
  const level = {};
  function lev(n) {
    if (level[n.node_id] !== undefined) return level[n.node_id];
    const deps = (n.depends_on || []).filter(d => byId[d]);
    level[n.node_id] = deps.length ? 1 + Math.max(...deps.map(d => lev(byId[d]))) : 0;
    return level[n.node_id];
  }
  nodes.forEach(lev);
  return level;
}

function renderGraph(t) {
  const nodes = t.execution_graph;
  if (!nodes.length) return '<div class="card"><b>Execution graph</b><p class="muted">No nodes.</p></div>';
  const level = levelMap(nodes);
  const cols = {};
  nodes.forEach(n => { const L = level[n.node_id]; (cols[L] = cols[L] || []).push(n); });
  const nLevels = Object.keys(cols).length;
  const maxRows = Math.max(...Object.values(cols).map(c => c.length));
  const W = 176, H = 56, GX = 54, GY = 16, PAD = 12;
  const width = PAD * 2 + nLevels * W + (nLevels - 1) * GX;
  const height = PAD * 2 + maxRows * H + (maxRows - 1) * GY;
  const pos = {};
  Object.entries(cols).forEach(([L, col]) => {
    const colH = col.length * H + (col.length - 1) * GY;
    col.forEach((n, i) => { pos[n.node_id] = {x: PAD + Number(L) * (W + GX), y: (height - colH) / 2 + i * (H + GY)}; });
  });
  const colors = {retrieve: '#2dd4bf', generate: '#5b6cff', verify: '#43d17c'};
  let edges = '', boxes = '';
  nodes.forEach(n => {
    (n.depends_on || []).forEach(d => {
      if (!pos[d]) return;
      const a = pos[d], b = pos[n.node_id];
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
      edges += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="#3a4270" stroke-width="1.6" marker-end="url(#arr)"/>`;
    });
  });
  nodes.forEach(n => {
    const p = pos[n.node_id], c = colors[n.kind] || '#888';
    const sub = `${n.kind}${n.model_tier ? ' · ' + n.model_tier : ''} · ${n.status} · ${n.latency_ms}ms`;
    boxes += `<g><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="10" fill="#1d2242" stroke="${c}" stroke-width="1.6"/>` +
      `<text x="${p.x + 12}" y="${p.y + 23}" fill="#e8eaf2" font-size="13" font-weight="700">${n.node_id}</text>` +
      `<text x="${p.x + 12}" y="${p.y + 41}" fill="#9aa3c0" font-size="11">${sub}</text></g>`;
  });
  const esc = t.escalation_history && t.escalation_history.length
    ? `<p class="muted">Escalated: ${t.escalation_history.map(e => e.from + ' → ' + e.to).join(', ')} — showing the final plan.</p>` : '';
  return `<div class="card"><b>Execution graph</b>${esc}<div style="overflow-x:auto"><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">` +
    `<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#3a4270" stroke-width="1.4"/></marker></defs>` +
    edges + boxes + `</svg></div></div>`;
}

let attached = null;
async function upload() {
  const f = document.getElementById('doc').files[0];
  const st = document.getElementById('docStatus');
  if (!f) { st.textContent = 'Choose a file first.'; return; }
  st.textContent = 'Ingesting…';
  const fd = new FormData(); fd.append('file', f);
  const res = await fetch('/documents', {method:'POST', body: fd});
  const t = await res.json();
  if (res.ok) { attached = t.source; st.textContent = `Ingested ${t.source}: ${t.chunks_ingested} chunk(s). It will be attached to your queries.`; }
  else { st.textContent = 'Upload failed: ' + (t.detail || res.status); }
}
function renderResult(t) {
  const out = document.getElementById('out');
  const pct = Math.round(t.confidence.confidence_score * 100);
  const dec = t.decision || {};
  const decLine = `Decision source: <b>${dec.source || 'rules'}</b>` +
    (dec.tier ? ` · planner tier ${dec.tier}` : '') +
    (dec.tokens ? ` · ${dec.tokens} tokens` : '') +
    (dec.latency_ms ? ` · ${dec.latency_ms}ms` : '');
  out.innerHTML = `
    <div class="card"><b>Answer</b><p>${t.answer}</p></div>
    <div class="card"><b>Routing decision</b>
      <p>Strategy: <b>${t.strategy}</b> · Complexity: ${t.complexity.complexity_score} · Task: ${t.analysis.task_type} · Risk: ${t.analysis.risk_level}</p>
      <p class="muted">${decLine}</p>
      <p class="muted">${t.rationale}</p></div>
    ${renderGraph(t)}
    ${renderWaterfall(t)}
    <div class="card"><b>Confidence: ${pct}%</b> — decision: ${t.confidence.decision}
      <div class="bar"><div style="width:${pct}%"></div></div>
      <p class="muted">Evidence coverage ${t.confidence.evidence_coverage} · Retrieval relevance ${t.confidence.retrieval_relevance} · Validation ${t.confidence.validation_passed ? 'passed' : 'failed'}</p></div>
    <div class="card"><b>Resource metrics</b>
      <table><tr><th>Tokens</th><th>Cost (USD)</th><th>Latency</th><th>Model calls</th><th>Escalations</th></tr>
      <tr><td>${t.metrics.tokens}</td><td>$${t.metrics.cost_usd}</td><td>${t.metrics.latency_ms}ms</td><td>${t.metrics.model_calls}</td><td>${t.metrics.escalations}</td></tr></table>
      ${t.escalation_history.length ? '<p class="muted">Escalations: ' + JSON.stringify(t.escalation_history) + '</p>' : ''}
    </div>`;
}

async function run() {
  const out = document.getElementById('out');
  out.innerHTML = '<div class="card">Running…</div>';
  const res = await fetch('/query', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({query: document.getElementById('q').value, attachments: attached ? [attached] : []})});
  renderResult(await res.json());
  loadTraces();
}

let traceCache = {};
async function loadTraces() {
  const el = document.getElementById('traces');
  try {
    const res = await fetch('/traces');
    const list = await res.json();
    traceCache = {}; list.forEach(t => traceCache[t.request_id] = t);
    if (!list.length) { el.innerHTML = ''; return; }
    const rows = list.slice().reverse().map(t =>
      `<tr class="tracerow" onclick="showTrace('${t.request_id}')"><td>${(t.query || '').slice(0, 60)}</td><td>${t.strategy}</td><td>${Math.round(t.confidence.confidence_score * 100)}%</td><td>${t.metrics.tokens}</td><td>${t.metrics.latency_ms}ms</td></tr>`).join('');
    el.innerHTML = `<div class="card"><b>Recent traces</b><p class="muted">Click a row to reload its full result, graph and timeline.</p><table><tr><th>Query</th><th>Strategy</th><th>Confidence</th><th>Tokens</th><th>Latency</th></tr>${rows}</table></div>`;
  } catch (e) { /* the trace list is best-effort */ }
}
function showTrace(id) {
  const t = traceCache[id];
  if (t) { renderResult(t); window.scrollTo({top: 0, behavior: 'smooth'}); }
}
loadTraces();
</script>
</body>
</html>
